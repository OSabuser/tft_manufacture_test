[project]
name = "hil"
version = "0.1.0"
description = "HIL-тесты для MIMXRT1052 — pytest + pyOCD + pyserial"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyocd>=0.43.1",
    "pyserial>=3.5",
    "mpremote>=1.23",
    "pytest>=9.0.2",
]
[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py", "*_test.py", "??_test_*.py"]
markers = [
    "gpio:  тесты GPIO",
    "interactive: тест требует действий оператора",
    "usb_vcom: основной канал связи USB_CDC",
    "uart:  тесты UART CLI",
    "opto:  тесты оптоизолированных входов",
    "m5:    тесты с участием M5StampPLC",
    "slow:  тесты с большими таймаутами",
    "board_v3: только плата V3.x (МЮ.Д08.06.10), напр. аппаратный watchdog",
    "sdram_stress: стресс-тест SDRAM по DCD-вариантам (долгий, стёртая флеш)",
    "flexspi_stress: стресс-тест чтения QSPI через FlexSPI (долгий, пишет последний 1 МБ флеш)",
]
 
log_cli = true
log_cli_level = "INFO"
log_format = "%(asctime)s [%(levelname)-8s] %(name)s: %(message)s"
log_date_format = "%H:%M:%S"
