# =============================================================================
# HAB Container — firmware/bootloader
# Расположение: tools/host/hab/hab_bootloader.yaml
#
# Сборка:
#   cd tools/host/hab
#   uv run nxpimage hab export --force -c hab_bootloader.yaml \
#       -o ../../../build/Release/bootloader_hab.bin
# =============================================================================

options:
  flags: 0x00
  startAddress: 0x60000000
  ivtOffset: 0x1000
  initialLoadSize: 0x2000
  family: mimxrt1050
  # DCD намеренно отсутствует — загрузчик не использует SDRAM

inputImageFile: "../../../build/Release/bootloader.bin"

sections: []