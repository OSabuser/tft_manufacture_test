# =============================================================================
# HAB Container — firmware/app (боевая прошивка)
# Расположение: tools/host/hab/hab_app.yaml
#
# Сборка:
#   cd tools/host/hab
#   uv run nxpimage hab export --force -c hab_app.yaml \
#       -o ../../../build/Release/app_hab.bin
# =============================================================================

options:
  flags: 0x00
  startAddress: 0x60000000
  ivtOffset: 0x1000
  initialLoadSize: 0x2000
  family: mimxrt1050
  DCDFilePath: ../dcd/dcd.bin  # обязателен — heap FreeRTOS и LCDIF в SDRAM

inputImageFile: "../../../build/Release/app.bin"

sections: []